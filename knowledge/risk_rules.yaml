version: "1.1.0"
updated: "2026-07-21"

# === ГЛОБАЛЬНЫЕ ПОРОГИ (синхронизировано с risk_rules.py) ===
thresholds:
  min_nmck: 100000
  min_contract_sum: 10000
  min_margin_percent: 10.0
  min_margin_siz_percent: 5.0
  max_cost_to_nmck_ratio: 0.85
  min_execution_days: 15
  min_execution_days_large_volume: 30

# === ЗАПРЕЩЁННЫЕ НАПРАВЛЕНИЯ (полный отказ) ===
# ИСПРАВЛЕНО: добавлено allow_if_types для защиты от ложных срабатываний
forbidden_directions:
  - name: "Лицензия МЧС на пожарную безопасность"
    pattern: "\\bлицензи[яи]\\s+МЧС\\b"
    action: "reject"
    reason: "Нет лицензии МЧС"
    allow_if_types: []

  - name: "Экспертиза промышленной безопасности"
    pattern: "экспертиз[аыуеой]?\\s+промышленной\\s+безопасности"
    action: "reject"
    reason: "Нет аккредитации на экспертизу промбезопасности"
    allow_if_types: []

  - name: "Промбезопасность (общее)"
    pattern: "\\bпромбезопасност[иь]\\b"
    action: "reject"
    reason: "Требуется лицензия Ростехнадзора"
    allow_if_types: []

  - name: "Медицинские работники"
    pattern: "\\bмедицинские\\s+работники\\b"
    action: "reject"
    reason: "Не работаем с медицинскими профилями"
    allow_if_types: []

  - name: "Информационная безопасность"
    pattern: "\\bинформационная\\s+безопасность\\b"
    action: "reject"
    reason: "Нет компетенций в ИБ"
    # ИСПРАВЛЕНО: не отклонять СОУТ/ОПР (может быть упоминание в документах)
    allow_if_types: ["sout", "opr", "соут", "опр"]

  - name: "Водительские права"
    pattern: "\\bводительские\\s+права\\b"
    action: "reject"
    reason: "Не выдаём водительские права"
    allow_if_types: []

  - name: "Гражданская оборона для категорированных"
    pattern: "\\bгражданская\\s+оборона\\b"
    action: "reject"
    reason: "Не работаем с категорированными организациями по ГО"
    allow_if_types: []

  - name: "Категорированные организации"
    pattern: "\\bкатегорированные\\s+организации\\b"
    action: "reject"
    reason: "Требуется лицензия ФСТЭК"
    allow_if_types: []

  - name: "Охранники с оружием"
    pattern: "\\bохранники\\s+с\\s+оружием\\b"
    action: "reject"
    reason: "Требуется лицензия ЧОП"
    allow_if_types: []

  - name: "Лицензия ФСБ / гостайна"
    pattern: "\\bлицензи[яи]\\s+ФСБ\\b|\\bгостайна\\b"
    action: "reject"
    reason: "Нет допуска к гостайне"
    allow_if_types: []

  - name: "Техническая диагностика"
    pattern: "\\bтехническая\\s+диагностика\\b"
    action: "reject"
    reason: "Требуется лицензия Ростехнадзора"
    allow_if_types: []

  - name: "Исследования воды / смывы / биология"
    pattern: "исследован[ио]\\s*вод[ыу]|питьевая\\s+вода|смыв[ыы]|гельминт[ыы]|биологи[яю]|микробиологи[яю]"
    action: "reject"
    reason: "Нет аккредитации"
    allow_if_types: []

# === СМЕШАННЫЕ ЛОТЫ ===
mixed_lots:
  rule: "Если в лоте есть хотя бы одна запрещённая программа — не участвуем целиком"
  exception: "СОУТ + другие услуги — считаем нормальным"
  iii_subcontractor: "ИИИ (рентген, УЗИ) — есть подрядчик, закладываем стоимость"

# === КРАСНЫЕ ФЛАГИ (риски, но не отказ) ===
red_flags:
  - name: "Маржа ниже минимума"
    condition: "margin_percent < 10"
    level: "high"
    message: "Маржа ниже 10% — риск убыточности"

  - name: "Себестоимость близка к НМЦК"
    condition: "cost_price / nmck > 0.85"
    level: "high"
    message: "Себестоимость > 85% от НМЦК — нет пространства для маржи"

  - name: "НМЦК ниже себестоимости"
    condition: "cost_price > nmck"
    level: "high"
    message: "НМЦК ниже расчётной себестоимости — участие невыгодно"

  - name: "НМЦК сильно ниже рынка"
    condition: "nmck > 0 AND cost_price > nmck * 1.2"
    level: "high"
    message: "НМЦК занижена минимум на 20% — возможно договорная закупка"

  - name: "Сжатые сроки"
    condition: "deadline_days < 15 AND volume_large"
    level: "medium"
    message: "Срок исполнения < 15 рабочих дней при большом объёме"

  - name: "Сверхсжатые сроки"
    condition: "deadline_days < 5"
    level: "high"
    message: "Срок исполнения < 5 дней — критический риск"

  - name: "НМЦК ниже рынка"
    condition: "nmck < market_average * 0.7"
    level: "medium"
    message: "НМЦК сильно ниже рыночной цены — признак договорняка"

  - name: "Отдалённый регион"
    condition: "region_distance > 3000"
    level: "medium"
    message: "Выезд в отдалённый регион — высокие транспортные расходы"

  - name: "Требуется аренда помещения"
    condition: "venue_required"
    level: "low"
    message: "Требуется аренда помещения — доп.расходы 5000-15000₽/день"

  - name: "История жалоб заказчика"
    condition: "customer_complaint_rate > 0.3"
    level: "medium"
    message: "Заказчик с историей частых жалоб / изменений контракта"

  - name: "Сложная логистика"
    condition: "addresses_count > 3"
    level: "medium"
    message: "Несколько адресов в разных городах — сложная логистика"

# === РЕКОМЕНДАЦИИ ПО РЕШЕНИЮ ===
decision_rules:
  recommended:
    conditions:
      - "margin_percent >= 10"
      - "no_forbidden_directions"
      - "risk_level != high"
      - "nmck >= 100000"
    action: "рекомендуется"

  reject:
    conditions:
      - "has_forbidden_directions"
      - "margin_percent < 10"
      - "risk_level == high"
    action: "не участвуем"

  submitted:
    conditions:
      - "already_submitted"
    action: "подано"

# === ОГРАНИЧЕНИЯ ПО СУММАМ ===
price_limits:
  education:
    distance_min: 10000
    full_time_min: 10000
  sout:
    min: 20000
  plk:
    min: 15000
  opr:
    min: 15000
  supply_siz:
    max_nmck: 300000
    min_margin: 5